<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cadence</title>
  <meta name="description" content="Training for riding first, and running, swimming and strength alongside: plans, workouts and your rides, with files for Garmin and Wahoo." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#24224f" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8e2da" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cadence" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- (as the page is read, before it's first drawn: Light or Dark, where chosen) -->
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
  <link rel="modulepreload" href="ui.js" />
  <link rel="modulepreload" href="charts.js" />
  <link rel="modulepreload" href="workouts.js" />
  <link rel="modulepreload" href="load.js" />
  <link rel="modulepreload" href="sample.js" />
  <link rel="modulepreload" href="formats.js" />
  <link rel="modulepreload" href="fit.js" />
</head>
<body>
  <!-- the sky behind it all: the account page's gradient, with slow light drifting over it -->
  <div class="sky" aria-hidden="true"><i class="aura a1"></i><i class="aura a2"></i><i class="aura a3"></i></div>
  <!-- behind the status bar, glass once the page has scrolled under it -->
  <div class="status" aria-hidden="true"></div>
  <div class="page" id="page">
    <main id="main" aria-busy="true"></main>
  </div>
  <nav class="tabbar" aria-label="Cadence">
    <div class="tabs" id="tabs"></div>
  </nav>
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="drop" id="drop" aria-hidden="true"></div>
  <input type="file" id="files" class="vh" multiple accept=".fit,.gpx,.tcx,.zwo,.erg,.mrc,.zip" tabindex="-1" aria-hidden="true" />
  <noscript><p class="noscript">Cadence needs JavaScript turned on.</p></noscript>
</body>
</html>
