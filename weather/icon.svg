<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <!-- a clear blue sky, a touch lighter at the top -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f97f8"/><stop offset="1" stop-color="#2b69de"/></linearGradient>
  <!-- the sun: flat and warm, a little deeper to its foot -->
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd44f"/><stop offset="1" stop-color="#f9b929"/></linearGradient>
  <!-- the cloud: frosted glass, whiter at the top; what's behind it soft through it -->
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.84"/><stop offset="1" stop-color="#f2f7ff" stop-opacity="0.72"/></linearGradient>
  <linearGradient id="rimFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.3"/><stop offset="1" stop-color="#fff" stop-opacity="0.15"/></linearGradient>
  <mask id="rimMask"><rect width="1024" height="1024" fill="url(#rimFade)"/></mask>
  <clipPath id="cloudClip"><path d="M 747.0 782 H 376.0 A 150 150 0 0 1 343.4 485.6 A 46 46 0 0 0 376.8 455.8 A 196 196 0 0 1 752.5 473.7 A 46 46 0 0 0 784.8 507.2 A 140 140 0 0 1 747.0 782 Z"/></clipPath>
  <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shade" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<circle cx="320" cy="392" r="192" fill="url(#sun)"/>
<!-- a faint shadow under the cloud -->
<path d="M 747.0 782 H 376.0 A 150 150 0 0 1 343.4 485.6 A 46 46 0 0 0 376.8 455.8 A 196 196 0 0 1 752.5 473.7 A 46 46 0 0 0 784.8 507.2 A 140 140 0 0 1 747.0 782 Z" fill="#0b3a9e" fill-opacity="0.16" filter="url(#shade)" transform="translate(0 16)"/>
<!-- through the frosted glass: the sky and the sun, softened -->
<g clip-path="url(#cloudClip)">
  <g filter="url(#frost)"><rect width="1024" height="1024" fill="url(#sky)"/><circle cx="320" cy="392" r="192" fill="url(#sun)"/></g>
  <path d="M 747.0 782 H 376.0 A 150 150 0 0 1 343.4 485.6 A 46 46 0 0 0 376.8 455.8 A 196 196 0 0 1 752.5 473.7 A 46 46 0 0 0 784.8 507.2 A 140 140 0 0 1 747.0 782 Z" fill="url(#glass)"/>
</g>
<!-- its edge: a fine light rim, brightest along the top -->
<path d="M 747.0 782 H 376.0 A 150 150 0 0 1 343.4 485.6 A 46 46 0 0 0 376.8 455.8 A 196 196 0 0 1 752.5 473.7 A 46 46 0 0 0 784.8 507.2 A 140 140 0 0 1 747.0 782 Z" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" mask="url(#rimMask)"/>
</svg>