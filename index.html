<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>George Farrow Green</title>
  <meta name="description" content="George Farrow Green — personal bio." />
  <meta name="theme-color" content="#0a0a0f" />

  <meta property="og:title" content="George Farrow Green" />
  <meta property="og:description" content="Personal bio of George Farrow Green." />
  <meta property="og:type" content="website" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient liquid-glass background -->
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="grain"></span>
  </div>

  <main class="stage">
    <article class="card glass" id="bio-card">
      <div class="card-glow" aria-hidden="true"></div>

      <div class="avatar glass-inset" id="avatar">
        <span id="monogram">G</span>
      </div>

      <h1 class="name" id="f-name">George Farrow Green</h1>
      <p class="role" id="f-role">Curious human · builder of things</p>

      <p class="bio" id="f-bio">
        This is a placeholder bio. Log in with your password to edit it — share a
        few warm sentences about who you are, what you make, and what you're into.
      </p>

      <nav class="links" id="links"></nav>
    </article>

    <footer class="footer">
      <span>© <span id="year"></span> <span id="f-name-foot">George Farrow Green</span></span>
      <button class="text-btn" id="open-login">Edit</button>
    </footer>
  </main>

  <!-- Login dialog -->
  <dialog class="modal glass" id="login-modal">
    <form method="dialog" id="login-form">
      <h2>Sign in to edit</h2>
      <p class="modal-sub">Enter your password to make changes.</p>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <p class="error" id="login-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="login-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="login-submit">Sign in</button>
      </div>
    </form>
  </dialog>

  <!-- Edit toolbar (shown when authenticated) -->
  <div class="toolbar glass" id="toolbar" hidden>
    <span class="toolbar-status" id="toolbar-status">Editing</span>
    <button class="btn ghost" id="add-link">+ Link</button>
    <button class="btn ghost" id="logout">Sign out</button>
    <button class="btn primary" id="save">Save</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
