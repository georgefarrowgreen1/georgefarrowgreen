# Cloudflare Pages configuration.
# Lets you create/bind KV and deploy from the terminal, bypassing the dashboard.
#
# Setup:
#   1. npm install -g wrangler
#   2. wrangler login
#   3. wrangler kv namespace create bio   # copy the printed id below
#   4. paste the id into `id =` under [[kv_namespaces]]
#   5. wrangler pages deploy .
#
# `name` must match your Pages project name in Cloudflare. If you haven't
# created the project yet, `wrangler pages deploy .` will offer to create it.

name = "georgefarrowgreen"
pages_build_output_dir = "."
compatibility_date = "2026-06-17"

# KV binding the site's Functions read/write. The variable name MUST be BIO_KV.
[[kv_namespaces]]
binding = "BIO_KV"
id = "10ec6d961a224b3a8b68a7c993ca0caf"

# R2 bucket for background photos (bucket name must exist in your account).
# Variable name MUST be BIO_R2. Images fall back to KV if this is ever removed.
[[r2_buckets]]
binding = "BIO_R2"
bucket_name = "bio-media"

# D1 database for contact-form submissions (and future structured data).
[[d1_databases]]
binding = "DB"
database_name = "bio-db"
database_id = "de4ad515-52c6-4cb3-9f8f-008384ef813a"
