# The local test stack's copy of the site (.tools/tests/server.sh: `wrangler pages dev`, which compiles functions/ as
# the Workers' build does). The live site is the two Workers, inflite-apps and gfg (wrangler.worker.jsonc,
# wrangler.gfg.jsonc, deployed by .github/workflows/worker-deploy.yml); the Pages project this once deployed is gone
# (.tools/workers/README.md). Its bindings are the Workers' own, which tickhost.test.mjs checks.

name = "georgefarrowgreen"
pages_build_output_dir = "."
compatibility_date = "2026-06-17"

# KV binding the site's Functions read/write. The variable name MUST be BIO_KV.
[[kv_namespaces]]
binding = "BIO_KV"
id = "10ec6d961a224b3a8b68a7c993ca0caf"

# R2 bucket for background photos (bucket name must exist in your account).
# Variable name MUST be BIO_R2. Images fall back to KV if this is ever removed.
[[r2_buckets]]
binding = "BIO_R2"
bucket_name = "bio-media"

# D1 database for contact-form submissions (and future structured data).
[[d1_databases]]
binding = "DB"
database_name = "bio-db"
database_id = "de4ad515-52c6-4cb3-9f8f-008384ef813a"

# Typing dots (workers/live): held in memory for a few seconds, never stored. Deployed by .github/workflows/live-deploy.yml.
[[durable_objects.bindings]]
name = "TYPING"
class_name = "Typing"
script_name = "georgefarrowgreen-live"
