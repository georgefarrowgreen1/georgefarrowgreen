<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>InFlight</title>
  <meta name="description" content="InFlight: end-to-end encrypted letters carried by pigeon, at the real distance between you." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f2f2f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="InFlight" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/pigeon/manifest.webmanifest" />
  <link rel="icon" href="/pigeon/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/pigeon/icon-180.png" />
  <script src="/pigeon/theme.js"></script>
  <link rel="stylesheet" href="/pigeon/styles.css" />
  <script type="module" src="/pigeon/app.js"></script>
  <link rel="modulepreload" href="/pigeon/crypto.js" />
  <link rel="modulepreload" href="/pigeon/land.js" />
  <link rel="modulepreload" href="/pigeon/places.js" />
  <link rel="modulepreload" href="/pigeon/countries.js" />
  <link rel="modulepreload" href="/pigeon/qr.js" />
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" class="defs"><path id="bird-path" d="M3.2 11.6 5 10.6C6.2 9.4 8 9.2 9.4 9.9L12.6 3.6C14.4 3 15.6 4 15.4 5.8L14.2 10.6C16.2 10.6 18.4 10 20.6 8.8L21 9.6C20.2 11.2 19.4 12.2 18.6 12.8L21.4 14.4 17.4 14.6C15.4 16.6 12 17.4 9.4 16.2 7.4 15.3 6.1 13.6 5.4 12.3Z"/></svg>
  <main class="notavail" aria-labelledby="na-title">
    <div class="na">
      <img class="na-icon" src="/pigeon/icon.svg" alt="" width="96" height="96" />
      <h1 id="na-title">InFlight isn’t available here</h1>
      <p>InFlight is made for iPhone, iPad and Android phones, so it doesn’t open on a computer. Open <b class="na-site">georgefarrowgreen.com/pigeon</b> on your phone or iPad instead.</p>
      <div class="na-qr" hidden></div>
    </div>
  </main>
  <div class="page">
    <div class="app" id="app">
      <div class="screen" id="screen"><div class="loading">Opening InFlight…</div></div>
    </div>
  </div>
  <div class="rotate">
    <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
    <p>InFlight works upright. Turn your phone to portrait.</p>
  </div>
  <noscript><p class="empty">InFlight needs JavaScript to encrypt your messages on this phone.</p></noscript>
</body>
</html>
