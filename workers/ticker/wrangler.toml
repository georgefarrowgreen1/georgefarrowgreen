# The site's scheduler (workers/ticker/index.js): a Worker of its own, as Pages has no schedules. Deployed on each push
# to main by .github/workflows/ticker-deploy.yml (once the repo has a CLOUDFLARE_API_TOKEN secret); by hand:
#   cd workers/ticker && npx wrangler deploy
#   npx wrangler secret put INFLIGHT_TICK_SECRET     (the same as the site's PIGEON_TICK_SECRET)
#   npx wrangler secret put WEATHER_TICK_SECRET      (only if the site's WEATHER_TICK_SECRET is different)
name = "georgefarrowgreen-ticker"
main = "index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

# (its log kept, where Cloudflare's dashboard shows it (Workers Logs): a job that's failing, its secret out of step or its
# route broken, is said there, and its run marked as failed (index.js), not only to a `wrangler tail` that's watching)
[observability]
enabled = true
