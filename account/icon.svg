<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <!-- the night sky the account's page is set in, at dusk: indigo, a touch lighter at the top -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7186ff"/><stop offset="1" stop-color="#4a45dc"/></linearGradient>
  <!-- the head: flat and warm, as Weather's sun is, a little deeper to its foot -->
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc38f"/><stop offset="1" stop-color="#ff8d5c"/></linearGradient>
  <!-- the shoulders: frosted glass, as Weather's cloud is, whiter at the top; what's behind them soft through them -->
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.84"/><stop offset="1" stop-color="#f3f4ff" stop-opacity="0.72"/></linearGradient>
  <linearGradient id="rimFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.3"/><stop offset="1" stop-color="#fff" stop-opacity="0.15"/></linearGradient>
  <mask id="rimMask"><rect width="1024" height="1024" fill="url(#rimFade)"/></mask>
  <clipPath id="bodyClip"><path d="M 328 852 A 104 104 0 0 1 224 748 V 728 C 224 652 342 532 512 532 C 682 532 800 652 800 728 V 748 A 104 104 0 0 1 696 852 Z"/></clipPath>
  <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shade" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<circle cx="512" cy="392" r="170" fill="url(#head)"/>
<!-- a faint shadow under the shoulders -->
<path d="M 328 852 A 104 104 0 0 1 224 748 V 728 C 224 652 342 532 512 532 C 682 532 800 652 800 728 V 748 A 104 104 0 0 1 696 852 Z" fill="#1c1a8f" fill-opacity="0.18" filter="url(#shade)" transform="translate(0 16)"/>
<!-- through the frosted glass: the sky and the head, softened -->
<g clip-path="url(#bodyClip)">
  <g filter="url(#frost)"><rect width="1024" height="1024" fill="url(#sky)"/><circle cx="512" cy="392" r="170" fill="url(#head)"/></g>
  <path d="M 328 852 A 104 104 0 0 1 224 748 V 728 C 224 652 342 532 512 532 C 682 532 800 652 800 728 V 748 A 104 104 0 0 1 696 852 Z" fill="url(#glass)"/>
</g>
<!-- their edge: a fine light rim, brightest along the top -->
<path d="M 328 852 A 104 104 0 0 1 224 748 V 728 C 224 652 342 532 512 532 C 682 532 800 652 800 728 V 748 A 104 104 0 0 1 696 852 Z" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" mask="url(#rimMask)"/>
</svg>
