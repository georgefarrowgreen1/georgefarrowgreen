<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Account · georgefarrowgreen.com</title>
  <meta name="description" content="Your georgefarrowgreen.com account: one sign-in for every app on the site." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b1024" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef1fb" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Account" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- the sky behind it all: slow light, and on a dark night, stars -->
  <div class="sky" aria-hidden="true">
    <i class="aura a1"></i><i class="aura a2"></i><i class="aura a3"></i>
    <canvas class="stars"></canvas>
  </div>
  <!-- the bar: the title, once the large one's scrolled away -->
  <header class="bar" id="bar">
    <span class="bar-title" id="bar-title" aria-hidden="true">Account</span>
  </header>
  <div class="page" id="page">
    <main id="main" aria-busy="true">
      <div class="skeleton" aria-label="Loading your account">
        <div class="sk sk-title"></div>
        <div class="sk sk-hero"></div>
        <div class="sk sk-row"></div>
        <div class="sk sk-group"></div>
      </div>
    </main>
  </div>
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Your account page needs JavaScript turned on.</p></noscript>
</body>
</html>
