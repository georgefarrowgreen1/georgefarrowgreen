<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Account · InFlite</title>
  <meta name="description" content="Your InFlite account: one sign-in for every app." />
  <!-- (a link to it, shared: its card, made by the apps that show one, from these) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="InFlite" />
  <meta property="og:title" content="Account · InFlite" />
  <meta property="og:description" content="Your InFlite account: one sign-in for every app." />
  <meta property="og:url" content="https://account.inflite.ai/" />
  <meta property="og:image" content="https://account.inflite.ai/og.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Your InFlite account: one sign-in for Chat, Weather, Fitness and Markets" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1b2860" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#dde3fb" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Account" />
  <link rel="icon" href="inflite.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="inflite-180.png?v=2" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- (as the page is read, before it's first drawn: the appearance chosen for it, and the account asked for) -->
  <script src="theme.js"></script>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
  <!-- (what the script brings in, asked for alongside it rather than after it's arrived) -->
  <link rel="modulepreload" href="crypto.js" />
</head>
<body>
  <!-- the sky behind it all: a gradient, with slow light drifting over it -->
  <div class="sky" aria-hidden="true">
    <i class="aura a1"></i><i class="aura a2"></i><i class="aura a3"></i><i class="dawn"></i><i class="dusk"></i>
  </div>
  <!-- behind the status bar, glass once the page has scrolled under it -->
  <div class="status" aria-hidden="true"></div>
  <div class="page" id="page">
    <main id="main" aria-busy="true">
      <div class="skeleton" aria-label="Loading your account">
        <div class="sk sk-title"></div>
        <div class="sk sk-hero"></div>
        <div class="sk sk-row"></div>
        <div class="sk sk-group"></div>
      </div>
    </main>
  </div>
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Your account page needs JavaScript turned on.</p></noscript>
</body>
</html>
