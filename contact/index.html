<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f2">
  <title>Contact · George Farrow-Green</title>
  <meta name="description" content="Get in touch with George Farrow-Green about InFlite, Cottage Holidays Blakeney, or something else.">
  <link rel="canonical" href="https://georgefarrowgreen.com/contact/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:title" content="Contact · George Farrow-Green">
  <meta property="og:url" content="https://georgefarrowgreen.com/contact/">
  <meta property="og:image" content="https://georgefarrowgreen.com/og.png">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/gfg-text.woff2" crossorigin>
  <link rel="stylesheet" href="/contact/contact.css">
  <link rel="stylesheet" href="/contact/transition.css">
  <script src="/loader.js"></script>
  <script src="/contact/sender.js" defer></script>
  <script src="/contact/contact.js" defer></script>
  <link rel="preload" as="image" href="/contact/gfg-outline.svg" media="(prefers-reduced-motion: no-preference)" fetchpriority="low">
</head>
<body>
  <header class="mast"><a href="/" aria-label="George Farrow-Green, home"><img src="/gfg-mark.svg" alt="" width="49" height="49"></a><a class="back" href="/"><svg class="bio-icon" width="17" height="17" aria-hidden="true" focusable="false"><use href="/bio-icons.svg#back"/></svg> Back to bio</a></header>
  <main>
    <section class="cover" aria-labelledby="contact-title">
      <img src="/projects/open-road.webp" width="1150" height="706" alt="" fetchpriority="high">
      <h1 id="contact-title" aria-label="Get in touch"><span class="line"><span>Get in</span></span><span class="line"><span>touch<i>.</i></span></span></h1>
      <a class="down" href="#message" aria-label="Go to message form"><svg class="bio-icon" width="20" height="20" aria-hidden="true" focusable="false"><use href="/bio-icons.svg#down"/></svg></a>
    </section>
    <section class="correspondence" id="message" aria-label="Contact George">
      <div class="direct">
        <h2>George Farrow-Green</h2>
        <a class="email" href="mailto:geo@inflite.ai">geo@inflite.ai</a>
        <div class="links"><a href="/details/George-Farrow-Green.vcf" download>Save contact <svg class="bio-icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/bio-icons.svg#download"/></svg></a><a href="https://www.instagram.com/georgefarrowgreen/">Instagram <svg class="bio-icon" width="16" height="16" aria-hidden="true" focusable="false"><use href="/bio-icons.svg#instagram"/></svg></a></div>
      </div>
      <div class="compose">
        <h2>Send a message</h2>
        <noscript><p>Email <a href="mailto:geo@inflite.ai">geo@inflite.ai</a> to get in touch.</p></noscript>
        <form id="enquiry" hidden>
          <div class="form-row topic-row">
            <label id="topic-label" for="enquiry-topic">Topic</label>
            <div class="topic-choice">
              <select id="enquiry-topic" name="topic">
                <option value="">Optional</option>
                <option>InFlite</option>
                <option>Cottage Holidays Blakeney</option>
                <option>Something else</option>
              </select>
              <button type="button" id="topic-trigger" role="combobox" aria-labelledby="topic-label" aria-expanded="false" aria-controls="topic-options" hidden></button>
              <svg class="bio-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
              <ul id="topic-options" role="listbox" aria-labelledby="topic-label" hidden></ul>
            </div>
          </div>
          <div class="identity">
            <div class="from" hidden>
              <span class="face" aria-hidden="true"></span>
              <span class="who"><b></b><small></small></span>
              <button class="change" type="button" aria-label="Change your name or email">
                <svg class="bio-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
              </button>
            </div>
            <div class="form-row">
              <label for="enquiry-name">Name</label>
              <input id="enquiry-name" name="name" autocomplete="name" placeholder="Your name" maxlength="100" required>
            </div>
            <div class="form-row">
              <label for="enquiry-email">Email</label>
              <input id="enquiry-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="200" required>
            </div>
          </div>
          <div class="message-field">
            <label for="enquiry-message">Message</label>
            <textarea id="enquiry-message" name="message" rows="4" maxlength="4000" required></textarea>
          </div>
          <input name="website" class="trap" aria-hidden="true" tabindex="-1" autocomplete="off">
          <div class="send-row">
            <p id="notice" role="alert" hidden></p>
            <button type="submit">Send message <svg class="bio-icon" width="17" height="17" aria-hidden="true" focusable="false"><use href="/bio-icons.svg#send"/></svg></button>
          </div>
        </form>
        <div id="sent" hidden><h3 tabindex="-1">Message sent.</h3><p>Thanks for getting in touch.</p><button id="again" type="button">Write another message</button></div>
      </div>
    </section>
  </main>
</body>
</html>
