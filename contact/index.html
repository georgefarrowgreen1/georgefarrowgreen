<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f2">
  <title>Contact · George Farrow-Green</title>
  <meta name="description" content="Get in touch with George Farrow-Green about InFlite, Cottage Holidays Blakeney, or something else.">
  <link rel="canonical" href="https://georgefarrowgreen.com/contact/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:title" content="Contact · George Farrow-Green">
  <meta property="og:url" content="https://georgefarrowgreen.com/contact/">
  <meta property="og:image" content="https://georgefarrowgreen.com/og.png">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk.woff2" crossorigin>
  <link rel="stylesheet" href="/contact/contact.css">
  <script src="/loader.js"></script>
  <script src="/contact/contact.js" defer></script>
  <link rel="stylesheet" href="/contact/transition.css">
  <link rel="preload" as="image" href="/contact/gfg-outline.svg" media="(prefers-reduced-motion: no-preference)" fetchpriority="low">
</head>
<body>
  <header class="mast"><a href="/" aria-label="George Farrow-Green, home"><img src="/gfg-mark.svg" alt="" width="49" height="49"></a><a class="back" href="/"><span aria-hidden="true">←</span> Back to bio</a></header>
  <main>
    <section class="cover" aria-labelledby="contact-title">
      <img src="/projects/open-road.webp" width="1150" height="706" alt="" fetchpriority="high">
      <h1 id="contact-title" aria-label="Get in touch"><span class="line"><span>Get in</span></span><span class="line"><span>touch<i>.</i></span></span></h1>
      <a class="down" href="#message" aria-label="Go to message form">↓</a>
    </section>
    <section class="correspondence" id="message" aria-label="Contact George">
      <div class="direct">
        <h2>George Farrow-Green</h2>
        <a class="email" href="mailto:geo@inflite.ai">geo@inflite.ai</a>
        <div class="links"><a href="/details/George-Farrow-Green.vcf" download>Save contact <span aria-hidden="true">↓</span></a><a href="https://www.instagram.com/georgefarrowgreen/">Instagram <span aria-hidden="true">↗</span></a></div>
      </div>
      <div class="compose">
        <h2>Send a message</h2>
        <noscript><p>Email <a href="mailto:geo@inflite.ai">geo@inflite.ai</a> to get in touch.</p></noscript>
        <form id="enquiry" hidden>
          <fieldset>
            <legend>What’s it about? <small>Optional</small></legend>
            <div class="topics">
              <label><input type="radio" name="topic" value="InFlite"><span>InFlite</span></label>
              <label><input type="radio" name="topic" value="Cottage Holidays Blakeney"><span>Cottage Holidays Blakeney</span></label>
              <label><input type="radio" name="topic" value="Something else"><span>Something else</span></label>
            </div>
          </fieldset>
          <div class="identity">
            <label>Your name<input name="name" autocomplete="name" maxlength="100" required></label>
            <label>Your email<input name="email" type="email" autocomplete="email" maxlength="200" required></label>
          </div>
          <label>Your message<textarea name="message" rows="4" maxlength="4000" required></textarea></label>
          <input name="website" class="trap" aria-hidden="true" tabindex="-1" autocomplete="off">
          <p id="notice" role="alert" hidden></p>
          <button type="submit">Send message <span aria-hidden="true">↗</span></button>
        </form>
        <div id="sent" hidden><h3 tabindex="-1">Message sent.</h3><p>Thanks for getting in touch.</p><button id="again" type="button">Write another message</button></div>
      </div>
    </section>
  </main>
</body>
</html>
