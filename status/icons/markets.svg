<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <!-- a clear morning over the markets: green, a touch lighter at the top -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd98d"/><stop offset="1" stop-color="#169a5b"/></linearGradient>
  <!-- the sun: flat and warm, as Weather's is, a little deeper to its foot -->
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd85a"/><stop offset="1" stop-color="#ffb52e"/></linearGradient>
  <!-- the bars, rising: frosted glass, as Weather's cloud is, whiter at the top; what's behind them soft through them -->
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/><stop offset="1" stop-color="#effff5" stop-opacity="0.72"/></linearGradient>
  <linearGradient id="rimFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.3"/><stop offset="1" stop-color="#fff" stop-opacity="0.15"/></linearGradient>
  <mask id="rimMask"><rect width="1024" height="1024" fill="url(#rimFade)"/></mask>
  <clipPath id="barsClip"><path d="M 294 560 H 346 A 44 44 0 0 1 390 604 V 748 A 44 44 0 0 1 346 792 H 294 A 44 44 0 0 1 250 748 V 604 A 44 44 0 0 1 294 560 Z M 486 442 H 538 A 44 44 0 0 1 582 486 V 748 A 44 44 0 0 1 538 792 H 486 A 44 44 0 0 1 442 748 V 486 A 44 44 0 0 1 486 442 Z M 678 318 H 730 A 44 44 0 0 1 774 362 V 748 A 44 44 0 0 1 730 792 H 678 A 44 44 0 0 1 634 748 V 362 A 44 44 0 0 1 678 318 Z"/></clipPath>
  <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shade" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<circle cx="720" cy="300" r="150" fill="url(#sun)"/>
<!-- a faint shadow under the bars -->
<path d="M 294 560 H 346 A 44 44 0 0 1 390 604 V 748 A 44 44 0 0 1 346 792 H 294 A 44 44 0 0 1 250 748 V 604 A 44 44 0 0 1 294 560 Z M 486 442 H 538 A 44 44 0 0 1 582 486 V 748 A 44 44 0 0 1 538 792 H 486 A 44 44 0 0 1 442 748 V 486 A 44 44 0 0 1 486 442 Z M 678 318 H 730 A 44 44 0 0 1 774 362 V 748 A 44 44 0 0 1 730 792 H 678 A 44 44 0 0 1 634 748 V 362 A 44 44 0 0 1 678 318 Z" fill="#05502b" fill-opacity="0.2" filter="url(#shade)" transform="translate(0 16)"/>
<!-- through the frosted glass: the sky and the sun, softened -->
<g clip-path="url(#barsClip)">
  <g filter="url(#frost)"><rect width="1024" height="1024" fill="url(#sky)"/><circle cx="720" cy="300" r="150" fill="url(#sun)"/></g>
  <rect width="1024" height="1024" fill="url(#glass)"/>
</g>
<!-- their edges: a fine light rim, brightest along the top -->
<path d="M 294 560 H 346 A 44 44 0 0 1 390 604 V 748 A 44 44 0 0 1 346 792 H 294 A 44 44 0 0 1 250 748 V 604 A 44 44 0 0 1 294 560 Z M 486 442 H 538 A 44 44 0 0 1 582 486 V 748 A 44 44 0 0 1 538 792 H 486 A 44 44 0 0 1 442 748 V 486 A 44 44 0 0 1 486 442 Z M 678 318 H 730 A 44 44 0 0 1 774 362 V 748 A 44 44 0 0 1 730 792 H 678 A 44 44 0 0 1 634 748 V 362 A 44 44 0 0 1 678 318 Z" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5" mask="url(#rimMask)"/>
</svg>
