<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>InFlite Status</title>
<meta name="description" content="Whether InFlite’s apps, sign-in and notifications are working right now, checked every five minutes.">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060814" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="alternate" type="application/atom+xml" title="InFlite Status" href="feed.xml">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#verdict">Skip to system status</a>
<main class="wrap">
  <div class="mini" id="mini" aria-hidden="true" inert><span class="dot"></span><b id="miniT">Checking…</b><nav class="jump" aria-label="Status page shortcuts"><a href="#apps">Apps</a><a href="#operations">Jobs &amp; APIs</a><a href="#incidents">Incidents</a><a href="#codesec">Reports</a></nav></div>
  <header class="head">
    <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 40 40"><g stroke-linecap="round" stroke-width="7.5"><path d="M13 13l6.5 6.5" stroke="#5d9cff"/><path d="M27 13l-6.5 6.5" stroke="#ff7a59"/><path d="M13 27l6.5-6.5" stroke="#a78bfa"/><path d="M27 27l-6.5-6.5" stroke="#3fd6b7"/></g><circle cx="20" cy="20" r="4.6" fill="#ffd23f"/></svg></span>
    <h1 class="word">InFlite <span>Status</span></h1>
  </header>

  <nav class="page-nav" aria-label="Status page sections"><a href="#apps">Apps</a><a href="#operations">Jobs &amp; APIs</a><a href="#incidents">Incidents</a><a href="#codesec">Bug reports</a></nav>

  <section tabindex="-1" class="verdict glass" id="verdict" data-s="none" aria-live="polite">
    <span class="halo" aria-hidden="true"><b></b></span>
    <div><h2 id="vtitle">Checking…</h2><p id="vsub">Asking each app how it’s doing.</p></div>
  </section>

  <div id="live" class="stack" hidden></div>
  <div id="groups" class="stack"></div>

  <section id="incidents" class="group">
    <div class="gh"><h2>Incidents</h2><span id="incSince">Last 90 days</span></div>
    <div class="glass list" id="incs"><p class="empty">Checking…</p></div>
  </section>

  <section id="codesec" class="group">
    <div class="gh"><h2>Bug reports</h2><span>Find your report</span></div>
    <div class="glass">
      <form class="look" id="lookForm"><input id="lookIn" aria-label="Report code" placeholder="Enter a report code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="submit">Find</button></form>
      <div id="found" role="status" aria-live="polite"></div>
      <div class="list" id="codes"></div>
    </div>
  </section>

  <noscript><p class="foot-note">This page needs JavaScript to show the checks.</p></noscript>
</main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
