<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InFlite Status</title>
<meta name="description" content="Whether InFlite’s apps, sign-in and notifications are working right now, checked every five minutes.">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060814" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="alternate" type="application/atom+xml" title="InFlite Status" href="feed.xml">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 40 40"><g stroke-linecap="round" stroke-width="7.5"><path d="M13 13l6.5 6.5" stroke="#5d9cff"/><path d="M27 13l-6.5 6.5" stroke="#ff7a59"/><path d="M13 27l6.5-6.5" stroke="#a78bfa"/><path d="M27 27l-6.5-6.5" stroke="#3fd6b7"/></g><circle cx="20" cy="20" r="4.6" fill="#ffd23f"/></svg></span>
    <h1 class="word">InFlite <span>Status</span></h1>
    <span class="live num" id="live"><i></i><span>Checking…</span></span>
  </header>

  <section class="verdict glass" id="verdict" data-s="none" aria-live="polite">
    <span class="halo" aria-hidden="true"><b><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" id="vicon"><path d="M12 7v5l3 2"/></svg></b></span>
    <div><h2 id="vtitle">Checking…</h2><p id="vsub">Asking each app how it’s doing.</p></div>
    <div class="stat num"><b id="vup">–</b><span id="vupl">up, 90 days</span></div>
    <div class="foot num" id="vfoot"><span>Checked every <b>5 minutes</b></span></div>
  </section>

  <div id="maint" class="maint" hidden></div>

  <div id="groups"></div>

  <section class="group">
    <div class="gh"><h2>Incidents</h2><span>Last 90 days</span></div>
    <div class="card glass" id="incidents"><p class="empty">Checking…</p></div>
  </section>

  <section class="group" id="bugsec" hidden>
    <div class="gh"><h2>Bug codes this week</h2><span>Where each stands</span></div>
    <div class="card glass" id="codes"></div>
  </section>

  <noscript><p class="foot-note">This page needs JavaScript to show the checks.</p></noscript>
</div>
<div class="tip" id="tip" hidden></div>
</body>
</html>
