name: Set up the Atlas production verifier

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Atlas build already live on inflite.ai"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  verifier:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check verifier setup with fixtures
        run: node --test .tools/tests/unit/atlas-production-verifier.test.mjs
      - name: Provision the production verifier
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_RELEASE: ${{ inputs.release }}
        run: node .tools/workers/prepare-atlas-verifier.mjs
