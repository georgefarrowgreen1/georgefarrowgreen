name: InFlight notifications

# Pigeons land on a timer. The server already checks for landings on the back
# of normal app traffic; this nudges it every 5 minutes so notifications still
# go out when nobody has InFlight open. Needs the repository secret
# INFLIGHT_TICK_SECRET to match PIGEON_TICK_SECRET in Cloudflare.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask InFlight to send notifications for landed pigeons
        env:
          SECRET: ${{ secrets.INFLIGHT_TICK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "INFLIGHT_TICK_SECRET isn't set, so there's nothing to do."; exit 0; fi
          code=$(curl -sS --max-time 60 -o reply.txt -w "%{http_code}" -X POST https://georgefarrowgreen.com/api/pigeon/notify-tick \
            -H "Authorization: Bearer $SECRET" -H "User-Agent: InFlight-Notify/1.0 (+https://georgefarrowgreen.com/pigeon/)")
          echo "HTTP $code"; head -c 400 reply.txt; echo
          # 404: PIGEON_TICK_SECRET isn't set in Cloudflare; 401: the two secrets differ;
          # 403 with an HTML page: Cloudflare's bot protection stopped the request.
          # warn rather than fail, so a setup problem doesn't send a failure email every 5 minutes
          if [ "$code" != "200" ]; then echo "::warning::InFlight notify tick got HTTP $code (see the notes above)"; fi
