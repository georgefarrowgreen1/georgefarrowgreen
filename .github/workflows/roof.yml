name: Turn One roof off or on (every module, or one)

# One roof's off switch (stage 1, spec §8.5; rollback level 1 in §11.2). Weather is a module of InFlite's one page at
# inflite.ai; state off puts the Worker secret ROOF_OFF = "1" on the hub's Worker(s), which at once makes /weather/
# Weather's milestone-1 page of the hub again and makes the hub refuse the module's files (/weather/roof/*), so a page
# already open can't start the module either and goes to that page the next time it comes back in sight. State on
# deletes ROOF_OFF: /weather/ is the framework again. A secret's change makes a new version of the same code: seconds, no
#
# Cloudflare changes a Worker's secrets only while its newest version is the one deployed (a push to another branch of
# the inflite repo uploads one that isn't). So every Worker named is checked first, and if any isn't settled, nothing is
# changed anywhere and the summary says what to do: deploy its production branch again, or use rollback level 2 (revert
# the One roof merge on the inflite repo's claude/inflite and dist7t). Never `wrangler versions secret put`, which builds
# on the newest version, another branch's.
#
# Stages 2–4 (roof/s24-contracts.md §12): one switch per module beside it. app all (the default) is the switch above,
# exactly. app weather puts ROOF_OFF_WEATHER "1" (off) or "0" (on): Weather alone. app markets, fitness or mail puts
# ROOF_<APP> "1" (on) or "0" (off): each is off until it's "1", and its on is refused while ROOF_OFF is set (every module
# off: turn them all on first). For mail, Mail's own Worker (inflite-email) is switched first, both ways: HUB_API for
# inflite.ai, HUB_API_NEXT for next.inflite.ai, "1" or "0" (its gate opens before any page can load the module, and
# closes before the page stops offering it); then the hub's. The settled check covers Mail's Worker too.
#
# Stage 3 (s3 spec §8): app chats puts ROOF_CHATS "1" (on) or "0" (off), as markets. Off, /chats/ is Chat's milestone-1
# page of the hub again (which does sign-in itself), /chats/sw.js its own worker, /chats/roof/* not found. Never revert
# MAIN while Chats is on at the hub: turn it off here first.
#
# Needs CLOUDFLARE_API_TOKEN with Account › Workers Scripts › Edit. CLOUDFLARE_ACCOUNT_ID only if the token can see more
# than one account.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which: all (every module: stage 1's switch), or one module: weather, markets, fitness, mail, chats"
        type: choice
        options: ["all", "weather", "markets", "fitness", "mail", "chats"]
        default: all
      state:
        description: "off: the module's own page at its address (its milestone-1 page at the hub); on: the module in InFlite's one page"
        type: choice
        options: ["off", "on"]
        required: true
      where:
        description: "Which hub: inflite.ai, next.inflite.ai (staging) or both"
        type: choice
        options: ["both", "inflite.ai", "next.inflite.ai"]
        default: both

permissions:
  contents: read

# (one change to the hub at a time: this, hub-key.yml, hub-off.yml and hub-stage.yml share it; this waits its turn)
concurrency:
  group: inflite-hub-key
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      ROOF_APP: ${{ inputs.app }}
      ROOF_STATE: ${{ inputs.state }}
      ROOF_WHERE: ${{ inputs.where }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/hub
      - name: Check the token's there
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN isn't set (Settings → Secrets and variables → Actions): a Cloudflare API token with Account › Workers Scripts › Edit. Nothing was changed: by hand, Workers → inflite → Settings → Variables and Secrets → ROOF_OFF (Secret, value 1 for off; deleted for on)."
            exit 1
          fi
          case "$ROOF_STATE" in off|on) ;; *) echo "::error::No such state: \"$ROOF_STATE\" (off or on). Nothing was changed."; exit 1 ;; esac
          case "${ROOF_APP:-all}" in all|weather|markets|fitness|mail|chats) ;; *) echo "::error::No such module: \"$ROOF_APP\" (all, weather, markets, fitness, mail or chats). Nothing was changed."; exit 1 ;; esac
          case "$ROOF_WHERE" in both|inflite.ai|next.inflite.ai) ;; *) echo "::error::No such hub: \"$ROOF_WHERE\" (both, inflite.ai or next.inflite.ai). Nothing was changed."; exit 1 ;; esac
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (and leaves it for the steps after as HUB_ACCOUNT: each step is a shell of its own)
      - name: Find the Cloudflare account
        id: account
        run: |
          . .github/hub/hub.sh
          cf_account
      # (every Worker named, before anything is changed anywhere: one that isn't settled stops the run here. Those that
      # weren't are left for the summary as ROOF_UNSETTLED: with both chosen and only the staging Worker unsettled, it
      # says to run this again for inflite.ai alone)
      - name: Check each Worker is settled (its newest version is the one deployed)
        id: settled
        run: |
          . .github/hub/hub.sh
          rc=0 unsettled=""
          ws="$(hub_workers "$ROOF_WHERE")"; [ "${ROOF_APP:-all}" = mail ] && ws="$MAIL_WORKER $ws"
          for w in $ws; do worker_settled "$w" || { rc=1; unsettled="$unsettled $w"; }; done
          echo "ROOF_UNSETTLED=${unsettled# }" >> "$GITHUB_ENV"
          exit $rc
      # (a module's on, while every module is off (ROOF_OFF): refused, nothing changed; all and weather never are)
      - name: Check a module's on isn't under ROOF_OFF
        id: allowed
        run: |
          . .github/hub/hub.sh
          for w in $(hub_workers "$ROOF_WHERE"); do roof_refused "${ROOF_APP:-all}" "$ROOF_STATE" "$w"; done
      # (in the runner's temporary folder: no wrangler config there, so wrangler takes each Worker by the name given;
      # the staging Worker first, so the live one is untouched should it fail; for mail, Mail's own Worker before each)
      - name: Set the switch (ROOF_OFF, ROOF_OFF_WEATHER or ROOF_<APP>; for mail, HUB_API first)
        id: set
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/.github/hub/hub.sh"
          read -r name value <<<"$(roof_secret "${ROOF_APP:-all}" "$ROOF_STATE")"
          for w in $(hub_workers "$ROOF_WHERE"); do
            if [ "${ROOF_APP:-all}" = mail ]; then roof_set "$MAIL_WORKER" "$(mail_gate "$w")" "$value"; fi
          done
          for w in $(hub_workers "$ROOF_WHERE"); do roof_set "$w" "$name" "$value"; done
      - name: Wait for each hub's /api/hub to say so
        id: wait
        timeout-minutes: 5
        run: |
          . .github/hub/hub.sh
          rc=0
          want=$([ "$ROOF_STATE" = off ] && echo false || echo true)
          for s in $(hub_sites "$ROOF_WHERE"); do wait_roof "$s" "${ROOF_APP:-all}" "$want" 120 || rc=1; done
          exit $rc
      - name: What's live now
        if: always()
        env:
          OUT_TOKEN: ${{ steps.token.outcome }}
          OUT_ACCOUNT: ${{ steps.account.outcome }}
          OUT_SETTLED: ${{ steps.settled.outcome }}
          OUT_ALLOWED: ${{ steps.allowed.outcome }}
          OUT_SET: ${{ steps.set.outcome }}
          OUT_WAIT: ${{ steps.wait.outcome }}
        run: |
          if [ ! -f .github/hub/hub.sh ]; then echo "::error::This repo's .github/hub wasn't checked out: nothing was changed."; exit 1; fi
          . .github/hub/hub.sh
          roof_verdict
