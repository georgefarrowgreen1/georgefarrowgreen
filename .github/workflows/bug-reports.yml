# InFlite's bug reports, filed as issues here every hour (.tools/bugs/file.mjs): each code one issue, a comment each time
# it's seen again. The reports come from the window every app shows when something breaks (the shared menu), and from the
# site's own errors (functions/_bugs.js). Asked of the site at its workers.dev address, with the scheduled jobs' key.
name: Bug reports

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-reports
  cancel-in-progress: false

jobs:
  file:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: File the new ones
        env:
          SITE: ${{ vars.TICK_SITE }}
          TICK_SECRET: ${{ secrets.INFLIGHT_TICK_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .tools/bugs/file.mjs
