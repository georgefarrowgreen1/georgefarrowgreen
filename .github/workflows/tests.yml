name: Chat checks

# On every push: every server and app file parses, and the unit tests pass (the space
# maths, eclipses, pigeons following people between worlds, key checks, the weather app's insights, and InFlite's: the
# hub, Today's Worker and page, Mail). Quick: no browser, no database. The end-to-end tests run locally: see
# .tools/tests/README.md.
#
# The tests that read the inflite repo look for it beside this one (../inflite), and skip where it isn't, so both are
# checked out side by side in the workspace: this repo in georgefarrowgreen/, the inflite repo (public: no token) in
# inflite/, at the canonical production branch (claude/inflite). This
# repo goes live before the inflite repo does, so a test whose inflite file isn't on that branch yet skips (Today
# First's: where the inflite repo beside has no today/src/hub.js).
on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ui-audit:
    # The locked Playwright browser build supports Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: georgefarrowgreen
      - name: Matching InFlite framework
        run: |
          git clone --quiet --depth 1 --branch claude/inflite https://github.com/georgefarrowgreen1/inflite inflite
          node georgefarrowgreen/.tools/security/framework-fixture.mjs inflite
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --prefix .tools/tests --no-audit --no-fund
        working-directory: georgefarrowgreen
      - run: .tools/tests/node_modules/.bin/playwright install --with-deps chromium
        working-directory: georgefarrowgreen
      - name: Unified app continuity, real schedules, downloads and lifetime
        working-directory: georgefarrowgreen
        run: node --test --test-concurrency=1 .tools/tests/appearance-apps-ui.test.cjs .tools/tests/unified-shell-integration.test.cjs .tools/tests/weather-workspace-ui.test.cjs .tools/tests/fitnessworkspace-pane.test.cjs .tools/tests/chatsworkspace-pane.test.cjs .tools/tests/marketsworkspace-pane.test.cjs
      - name: UI controls, focus, history shortcuts and reduced motion
        working-directory: georgefarrowgreen
        run: node --test --test-concurrency=1 .tools/tests/shared-modal-ui.test.cjs .tools/tests/shared-chrome-continuity.test.cjs .tools/tests/chats-ui-refinement.test.cjs .tools/tests/chats-actions.test.cjs .tools/tests/weather-places-ui.test.cjs .tools/tests/weather-flow-ui.test.cjs .tools/tests/fitness-ui-refinement.test.cjs .tools/tests/fitness-filter-continuity.test.cjs .tools/tests/fitting-dialogs.test.cjs .tools/tests/account-status-motion.test.cjs .tools/tests/chats-motion.test.cjs .tools/tests/weather-motion-ui.test.cjs .tools/tests/shared-geometry.test.cjs .tools/tests/chats-geometry.test.cjs .tools/tests/fitness-geometry.test.cjs .tools/tests/markets-geometry.test.cjs

  files-integration:
    # Current pinned engines, native private HTTPS downloads and real D1/R2.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: georgefarrowgreen
      - name: Matching InFlite framework
        run: |
          git clone --quiet --depth 1 --branch claude/inflite https://github.com/georgefarrowgreen1/inflite inflite
          node georgefarrowgreen/.tools/security/framework-fixture.mjs inflite
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Locked browser and workerd tools
        run: npm ci --prefix georgefarrowgreen/.tools/tests --no-audit --no-fund
      - name: Mail runtime dependencies
        run: npm ci --prefix inflite/email --omit=dev --no-audit --no-fund
      - name: Install pinned browser engine
        working-directory: georgefarrowgreen
        run: .tools/tests/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Real Files proxy, private Drive and Explorer integration
        working-directory: georgefarrowgreen
        env:
          WEB_UI_BROWSER: ${{ matrix.browser }}
          FILES_SCREENSHOTS: ${{ runner.temp }}/files-${{ matrix.browser }}
        run: npm run test:files-integration --prefix .tools/tests
      - name: Unified Open/Save, Activity and recovery with the real backend
        working-directory: georgefarrowgreen
        env:
          WEB_UI_BROWSER: ${{ matrix.browser }}
          FILES_SCREENSHOTS: ${{ runner.temp }}/os-next-${{ matrix.browser }}
        run: node --test --test-concurrency=1 .tools/tests/os-next-integration.test.cjs .tools/tests/organise400-integration.test.cjs .tools/tests/life410-integration.test.cjs .tools/tests/security-module-ui.test.cjs
      - name: Canonical account and passkey flow
        working-directory: georgefarrowgreen
        env:
          IDENTITY_BROWSER: ${{ matrix.browser }}
        run: node --test --test-concurrency=1 .tools/tests/identity-ui.test.cjs .tools/tests/appearance-ui.test.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: files-${{ matrix.browser }}-reliability
          path: ${{ runner.temp }}/files-${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: georgefarrowgreen
      - name: The inflite repo beside it
        run: |
          git clone --quiet --depth 1 --branch claude/inflite https://github.com/georgefarrowgreen1/inflite inflite
          node georgefarrowgreen/.tools/security/framework-fixture.mjs inflite
          echo "The paired release framework beside it at $(git -C inflite rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # (Mail's one package, which its tests' mail goes through; not its tools)
      - name: Mail's package
        run: |
          if [ -f inflite/email/package-lock.json ]; then npm ci --prefix inflite/email --omit=dev --no-audit --no-fund; fi
      - name: Every file parses
        working-directory: georgefarrowgreen
        run: |
          fail=0
          for f in $(git ls-files 'functions/*.js' 'pigeon/*.js' 'weather/*.js' 'fitness/*.js' 'markets/*.js' 'account/*.js' 'fitting/*.js' 'app.js' 'loader.js' 'loader-portrait.js'); do node --check "$f" || { echo "::error file=$f::doesn't parse"; fail=1; }; done
          exit $fail
      - name: Install locked test and performance-budget tools
        working-directory: georgefarrowgreen
        run: npm ci --prefix .tools/tests --no-audit --no-fund
      - name: Release supply-chain policy and dependency audits
        working-directory: georgefarrowgreen
        run: node .tools/security/check.mjs --require-root --audit --out "$RUNNER_TEMP/ci-security"
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-security
          path: ${{ runner.temp }}/ci-security
          if-no-files-found: warn
          retention-days: 14
      - name: Unit tests
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/unit/*.test.mjs

  iphone:
    # The locked Playwright browser build supports Ubuntu 24.04, not 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: georgefarrowgreen
      - name: Matching InFlite framework
        run: |
          git clone --quiet --depth 1 --branch claude/inflite https://github.com/georgefarrowgreen1/inflite inflite
          node georgefarrowgreen/.tools/security/framework-fixture.mjs inflite
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --prefix .tools/tests --no-audit --no-fund
        working-directory: georgefarrowgreen
      - run: .tools/tests/node_modules/.bin/playwright install --with-deps chromium
        working-directory: georgefarrowgreen
      - name: Admin profile photos fill their circles on mobile and desktop
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/admin-avatars.test.cjs
      - name: Homepage carousel motion, swipe, focus and reduced motion
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homecarousel.test.cjs
      - name: Unified authentication screens and recovery
        working-directory: georgefarrowgreen
        env:
          AUTH_SCREENSHOTS: ${{ runner.temp }}/iphone/auth
        run: |
          node .tools/tests/signinrefined.mjs
          node .tools/tests/authflows.mjs
      - name: Homepage loading and InFlite profile hand-off
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homeaccount.test.cjs
      - name: Portfolio charts, cash holdings, interest estimates and retry safety
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/markets-cash.test.cjs .tools/tests/markets-overview.test.cjs .tools/tests/markets-chart.test.cjs
      - name: Homepage portrait loading, readiness and fallback
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homeloader.test.cjs
      - name: Homepage back-to-top navigation and keyboard focus
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homebacktotop.test.cjs
      - name: Homepage motion, app handoff and contact feedback
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homemotion.test.cjs .tools/tests/bioarrival.test.cjs
      - name: Chat keyboard, resume, rotation, scrolling and tap targets
        working-directory: georgefarrowgreen
        run: |
          node .tools/tests/roofchatcomposer.mjs "$RUNNER_TEMP/iphone" "$RUNNER_TEMP/iphone/composer"
          node .tools/tests/roofchatmount.mjs "$RUNNER_TEMP/iphone" "$RUNNER_TEMP/iphone/mount" | tee "$RUNNER_TEMP/iphone/mount.log"
          grep -q '^FAILS 0$' "$RUNNER_TEMP/iphone/mount.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: iphone-reliability
          path: ${{ runner.temp }}/iphone
          retention-days: 7
