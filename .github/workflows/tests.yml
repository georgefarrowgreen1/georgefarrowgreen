name: Chat checks

# On every push: every server and app file parses, and the unit tests pass (the space
# maths, eclipses, pigeons following people between worlds, key checks, the weather app's insights, and InFlite's: the
# hub, Today's Worker and page, Mail). Quick: no browser, no database. The end-to-end tests run locally: see
# .tools/tests/README.md.
#
# The tests that read the inflite repo look for it beside this one (../inflite), and skip where it isn't, so both are
# checked out side by side in the workspace: this repo in georgefarrowgreen/, the inflite repo (public: no token) in
# inflite/, at the branch of the same name as this push's where it has one, else its live branch (claude/inflite). This
# repo goes live before the inflite repo does, so a test whose inflite file isn't on that branch yet skips (Today
# First's: where the inflite repo beside has no today/src/hub.js).
on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: georgefarrowgreen
      - name: The inflite repo beside it
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          R=https://github.com/georgefarrowgreen1/inflite
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$R" "refs/heads/$BRANCH" >/dev/null 2>&1; then B=$BRANCH; else B=claude/inflite; fi
          git clone --quiet --depth 1 --branch "$B" "$R" inflite
          echo "The inflite repo beside: $B at $(git -C inflite rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (Mail's one package, which its tests' mail goes through; not its tools)
      - name: Mail's package
        run: |
          if [ -f inflite/email/package-lock.json ]; then npm ci --prefix inflite/email --omit=dev --no-audit --no-fund; fi
      - name: Every file parses
        working-directory: georgefarrowgreen
        run: |
          fail=0
          for f in $(git ls-files 'functions/*.js' 'pigeon/*.js' 'weather/*.js' 'fitness/*.js' 'markets/*.js' 'account/*.js' 'fitting/*.js' 'app.js' 'loader.js' 'loader-portrait.js'); do node --check "$f" || { echo "::error file=$f::doesn't parse"; fail=1; }; done
          exit $fail
      - name: Install locked test and performance-budget tools
        working-directory: georgefarrowgreen
        run: npm ci --prefix .tools/tests --no-audit --no-fund
      - name: Unit tests
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/unit/*.test.mjs

  iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: georgefarrowgreen
      - name: Matching InFlite framework
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          R=https://github.com/georgefarrowgreen1/inflite
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$R" "refs/heads/$BRANCH" >/dev/null 2>&1; then B=$BRANCH; else B=claude/inflite; fi
          git clone --quiet --depth 1 --branch "$B" "$R" inflite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .tools/tests --no-audit --no-fund
        working-directory: georgefarrowgreen
      - run: .tools/tests/node_modules/.bin/playwright install --with-deps chromium
        working-directory: georgefarrowgreen
      - name: Admin profile photos fill their circles on mobile and desktop
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/admin-avatars.test.cjs
      - name: Homepage carousel motion, swipe, focus and reduced motion
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homecarousel.test.cjs
      - name: Unified authentication screens and recovery
        working-directory: georgefarrowgreen
        env:
          AUTH_SCREENSHOTS: ${{ runner.temp }}/iphone/auth
        run: |
          node .tools/tests/signinrefined.mjs
          node .tools/tests/authflows.mjs
      - name: Homepage loading and InFlite profile hand-off
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homeaccount.test.cjs
      - name: Cash holdings, interest estimates, editing and retry safety
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/markets-cash.test.cjs .tools/tests/markets-overview.test.cjs
      - name: Homepage portrait loading, readiness and fallback
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homeloader.test.cjs
      - name: Homepage back-to-top navigation and keyboard focus
        working-directory: georgefarrowgreen
        run: node --test .tools/tests/homebacktotop.test.cjs
      - name: Chat keyboard, resume, rotation, scrolling and tap targets
        working-directory: georgefarrowgreen
        run: |
          node .tools/tests/roofchatcomposer.mjs "$RUNNER_TEMP/iphone" "$RUNNER_TEMP/iphone/composer"
          node .tools/tests/roofchatmount.mjs "$RUNNER_TEMP/iphone" "$RUNNER_TEMP/iphone/mount" | tee "$RUNNER_TEMP/iphone/mount.log"
          grep -q '^FAILS 0$' "$RUNNER_TEMP/iphone/mount.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-reliability
          path: ${{ runner.temp }}/iphone
          retention-days: 7
