name: Turn InFlite's hub off

# Disable the live and staging hubs, then explicitly disable HUB_KEY on both site Workers.
# Optional inputs also disable HUB_PUSH, remove hub push rows, or set TODAY_ACTS to 0.
# Explicit off values override encrypted stored defaults. Updates are live immediately.
# Requires Workers Scripts Edit, plus D1 Edit when taking back push rows.
on:
  workflow_dispatch:
    inputs:
      take_back_pushes:
        description: "Also take back the push rows the hub fanned out (D1 rows with via = 'hub'), and delete HUB_PUSH"
        type: boolean
        default: false
      stop_today_acts:
        description: "Also stop Today's morning acting on plans (TODAY_ACTS = \"0\"): before rolling the inflite repo back to Today 1.08"
        type: boolean
        default: false

permissions:
  contents: read

# (one change to the hub at a time: this, hub-key.yml and hub-stage.yml share it. The off switch doesn't wait: it stops a
# run of either that's under way, and runs again safely)
concurrency:
  group: inflite-hub-key
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  turn-off:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      PUSHES: ${{ inputs.take_back_pushes && '1' || '0' }}
      ACTS: ${{ inputs.stop_today_acts && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/hub
      - name: Check the token's there
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN isn't set (Settings → Secrets and variables → Actions): a Cloudflare API token with Account › Workers Scripts › Edit. Nothing was changed: to turn the hub off by hand, delete HUB_KEY from the Worker inflite (Workers → inflite → Settings → Variables and Secrets)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (and leaves it for the steps after as HUB_ACCOUNT: each step is a shell of its own)
      - name: Find the Cloudflare account
        id: account
        run: |
          . .github/hub/hub.sh
          cf_account
      # turns the hub off within minutes too)
      - name: Delete the Worker's HUB_KEY (the hub is off at once)
        id: worker
        if: ${{ !cancelled() && steps.account.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/.github/hub/hub.sh"
          take_key_worker inflite
      - name: Delete the staging hub's HUB_KEY (inflite-next), if there's one
        id: staging
        if: ${{ !cancelled() && steps.account.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/.github/hub/hub.sh"
          take_key_worker inflite-next
      - name: Wait for inflite.ai/api/hub to say it isn't ready
        id: wait1
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          . .github/hub/hub.sh
          wait_hub false 180
      - name: Delete the site Workers’ HUB_KEY (and what the inputs ask)
        id: site
        if: ${{ !cancelled() && steps.account.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/.github/hub/hub.sh"
          site_off "$PUSHES" "$ACTS"
      - name: Wait for inflite.ai/api/hub to say it isn't ready (the site Workers’ key gone)
        id: wait2
        if: ${{ !cancelled() && steps.worker.outcome != 'success' && steps.site.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          . .github/hub/hub.sh
          wait_hub false 480
      - name: Check Chat's hub copy is not found to anyone without the key
        id: door
        if: ${{ !cancelled() && steps.account.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          . .github/hub/hub.sh
          door_shut
      - name: Take back the push rows the hub fanned out (D1)
        id: d1
        if: ${{ !cancelled() && inputs.take_back_pushes && steps.account.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/.github/hub/hub.sh"
          take_back_pushes
      - name: What's off now
        if: always()
        env:
          OUT_TOKEN: ${{ steps.token.outcome }}
          OUT_ACCOUNT: ${{ steps.account.outcome }}
          OUT_WORKER: ${{ steps.worker.outcome }}
          OUT_STAGING: ${{ steps.staging.outcome }}
          OUT_WAIT1: ${{ steps.wait1.outcome }}
          OUT_SITE: ${{ steps.site.outcome }}
          OUT_WAIT2: ${{ steps.wait2.outcome }}
          OUT_DOOR: ${{ steps.door.outcome }}
          OUT_D1: ${{ steps.d1.outcome }}
        run: |
          if [ ! -f .github/hub/hub.sh ]; then echo "::error::This repo's .github/hub wasn't checked out: nothing was changed. To turn the hub off by hand, delete HUB_KEY from the Worker inflite (Workers → inflite → Settings → Variables and Secrets)."; exit 1; fi
          . .github/hub/hub.sh
          off_verdict
