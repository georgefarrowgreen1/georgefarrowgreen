name: Deploy the scheduler

# workers/ticker: a small Cloudflare Worker that asks for Chat's and Weather's
# notification jobs every 5 minutes, on Cloudflare's own schedule (GitHub's runs late).
# Deployed on each push to main, with the jobs' secrets the repository already has
# (INFLIGHT_TICK_SECRET, and WEATHER_TICK_SECRET if it's set). Needs one more secret:
# CLOUDFLARE_API_TOKEN, a Cloudflare API token with "Workers Scripts: Edit" (the
# "Edit Cloudflare Workers" template). CLOUDFLARE_ACCOUNT_ID is needed only if the
# token can see more than one account. Until the token is set, this does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INFLIGHT_TICK_SECRET: ${{ secrets.INFLIGHT_TICK_SECRET }}
      WEATHER_TICK_SECRET: ${{ secrets.WEATHER_TICK_SECRET }}
    steps:
      - name: Check the token's there
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN isn't set, so the scheduler isn't deployed."; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$INFLIGHT_TICK_SECRET" ]; then echo "::warning::INFLIGHT_TICK_SECRET isn't set: the scheduler would have nothing to ask with."; echo "go=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=1" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == '1'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == '1'
        with:
          node-version: 22
      - name: Deploy workers/ticker and give it the jobs' secrets
        if: steps.ready.outputs.go == '1'
        working-directory: workers/ticker
        run: |
          W="npx --yes wrangler@4.149.0"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          $W deploy
          printf '%s' "$INFLIGHT_TICK_SECRET" | $W secret put INFLIGHT_TICK_SECRET
          # (only when the site's Weather secret differs: otherwise the scheduler uses Chat's for both)
          if [ -n "$WEATHER_TICK_SECRET" ]; then printf '%s' "$WEATHER_TICK_SECRET" | $W secret put WEATHER_TICK_SECRET; fi
