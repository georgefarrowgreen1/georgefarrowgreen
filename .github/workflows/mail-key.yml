name: Give Mail and the account their shared key

# Give both site Workers and Mail's Worker the same MAIL_KEY. Updates are live immediately.
# Rotating the key briefly interrupts Mail integration until all Workers have the same value.
# Requires Workers Scripts Edit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inflite-hub-key
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/hub
      - name: Check the token's there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN isn't set. Nothing was changed."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the Cloudflare account
        run: |
          . .github/hub/hub.sh
          cf_account
      - name: Make a new key, and give it to the site Workers, then Mail's Worker
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/.github/hub/hub.sh"
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          [ ${#key} -eq 64 ] || { fail "The key made wasn't 64 hex digits. Nothing was changed."; exit 1; }
          worker_settled "$MAIL_WORKER" || exit 1
          site_secret MAIL_KEY "$key" || { fail "Couldn't set the site Workers’ MAIL_KEY. An earlier Worker may already have changed; run this again after fixing the error."; exit 1; }
          say "Both site Workers’ MAIL_KEY is the new key."
          printf '%s' "$key" | $WRANGLER secret put MAIL_KEY --name "$MAIL_WORKER" || { fail "Couldn't set $MAIL_WORKER's MAIL_KEY (the site Workers have the new one: run this again)."; exit 1; }
          say "$MAIL_WORKER's MAIL_KEY is the same key."
