name: UK routing service
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [workers/routing/**, functions/_fitloops.js, functions/_fitroutechoices.js, functions/_fitroutenetwork.js, fitness/routes-geometry.js, .github/workflows/routing-service.yml]
permissions:
  contents: read
concurrency:
  group: uk-routing-service
  cancel-in-progress: false
jobs:
  service:
    if: github.ref == 'refs/heads/main'
    name: Verify and deploy the owned UK router
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Identify the deployed release
        id: release
        run: |
          release=$(git rev-parse HEAD^{tree})
          echo "id=$release" >> "$GITHUB_OUTPUT"
          node workers/routing/scripts/release-check.mjs "$release" >> "$GITHUB_OUTPUT"
      - name: Read-only hosting preflight
        if: steps.release.outputs.current != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node workers/routing/scripts/preflight.mjs
      - name: Locked routing tools and dependency audit without production credentials
        run: |
          npm ci --prefix workers/routing --ignore-scripts --no-audit --no-fund
          npm audit --prefix workers/routing --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Restore the owned immutable map snapshot
        if: steps.release.outputs.current != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node workers/routing/scripts/snapshot.mjs restore
      - name: Prepare verified engine and UK road data
        if: steps.release.outputs.current != 'true'
        run: python3 workers/routing/scripts/prepare.py
      - name: Coverage, request validation and failover checks
        run: npm test --prefix workers/routing
      - name: Build the routing container
        if: steps.release.outputs.current != 'true'
        run: docker build -t inflite-routing:check workers/routing
      - name: Index cycling corridors from the verified graph
        if: steps.release.outputs.current != 'true'
        run: docker build --target corridor-data --output type=local,dest=workers/routing/.build workers/routing
      - name: Route with networking disabled and production resource limits
        if: steps.release.outputs.current != 'true'
        run: |
          docker run -d --name inflite-routing-check --network none --memory 1g --cpus 0.25 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges inflite-routing:check
          docker exec inflite-routing-check java -Xmx32m -cp /opt/router/classes Probe
          node workers/routing/scripts/validate-container.mjs
      - name: Stop the test container
        if: always()
        run: docker rm -f inflite-routing-check 2>/dev/null || true
      - name: Mirror the validated snapshot into owned storage
        if: steps.release.outputs.current != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node workers/routing/scripts/snapshot.mjs mirror
      - name: Deploy the isolated routing Worker and containers
        if: steps.release.outputs.current != 'true'
        working-directory: workers/routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROUTING_RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npm run deploy -- --var "ROUTING_RELEASE_ID:$ROUTING_RELEASE_ID"
      - name: Verify England, Wales, Scotland, Northern Ireland and islands
        working-directory: workers/routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-probe.mjs
