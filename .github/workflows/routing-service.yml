name: UK routing service
on:
  workflow_dispatch:
  push:
    branches: [main, codex/uk-routing-service]
    paths: [workers/routing/**, functions/_fitloops.js, fitness/routes-geometry.js, .github/workflows/routing-service.yml]
permissions:
  contents: read
concurrency:
  group: uk-routing-service
  cancel-in-progress: false
jobs:
  service:
    name: Verify and deploy the owned UK router
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only hosting preflight
        run: node workers/routing/scripts/preflight.mjs
      - run: npm ci --prefix workers/routing --no-audit --no-fund
      - name: Restore the owned immutable map snapshot
        run: node workers/routing/scripts/snapshot.mjs restore
      - name: Prepare verified engine and UK road data
        run: python3 workers/routing/scripts/prepare.py
      - name: Coverage, request validation and failover checks
        run: npm test --prefix workers/routing
      - name: Build the routing container
        run: docker build -t inflite-routing:check workers/routing
      - name: Route with networking disabled and production resource limits
        run: |
          docker run -d --name inflite-routing-check --network none --memory 1g --cpus 0.25 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges inflite-routing:check
          docker exec inflite-routing-check java -Xmx32m -cp /opt/router/classes Probe
          node workers/routing/scripts/validate-container.mjs
      - name: Stop the test container
        if: always()
        run: docker rm -f inflite-routing-check 2>/dev/null || true
      - name: Mirror the validated snapshot into owned storage
        run: node workers/routing/scripts/snapshot.mjs mirror
      - name: Deploy the isolated routing Worker and containers
        working-directory: workers/routing
        run: |
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npm run deploy
      - name: Verify England, Wales, Scotland, Northern Ireland and islands
        working-directory: workers/routing
        run: node scripts/deploy-probe.mjs
