# status.inflite.ai, checked from outside Cloudflare: every 15 minutes, from GitHub's servers, the site is asked whether its own
# checks are still running (functions/_status.js outsideSaw, at the site's workers.dev address with the scheduled jobs'
# key). If the site doesn't answer, or its checks have stopped (none for 20 minutes), this run fails, and GitHub emails the
# repository's owner: the one alert that still reaches you when Cloudflare itself, or the ticker, is down. What it saw is
# kept, and the status page says it was checked from outside.
name: Status, from outside

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-outside
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the site whether its checks are running
        env:
          SITE: ${{ vars.TICK_SITE || 'https://inflite-apps.georgefarrowgreen.workers.dev' }}
          TICK_SECRET: ${{ secrets.INFLIGHT_TICK_SECRET }}
        run: |
          if [ -z "$TICK_SECRET" ]; then echo "::error::INFLIGHT_TICK_SECRET is missing: monitoring cannot run."; exit 1; fi
          body=$(curl -sS --max-time 30 -w '\n%{http_code}' -X POST -H "Authorization: Bearer $TICK_SECRET" "$SITE/api/status/outside" || echo $'\n000')
          code=$(printf '%s' "$body" | tail -n1); json=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $code: $json"
          if [ "$code" != "200" ]; then echo "::error::The site didn't answer the status check (HTTP $code)."; exit 1; fi
          STATUS_CHECK_JSON="$json" node -e '
            const report = JSON.parse(process.env.STATUS_CHECK_JSON);
            if (report.ok !== true || report.stale !== false) {
              console.error("::error::The status checks are missing, invalid or over 20 minutes old."); process.exit(1);
            }
            const alerts = Array.isArray(report.alerts) ? report.alerts : [];
            if (alerts.length) {
              console.error("::error::Monitoring alerts: " + alerts.join("; ")); process.exit(1);
            }
            if (report.down?.length) console.warn("::warning::Down now: " + report.down.join(", "));
            console.log("Checks running; no confirmed API or performance alerts.");
          '
