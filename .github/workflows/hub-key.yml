name: Give InFlite's hub its key

# Give both site Workers (inflite-apps and gfg) and the selected hub Workers one shared HUB_KEY.
# Updates are live immediately. Wait for readiness and check the private Chat route after rotation.
# Rotate only when the hub is off or broken: sequential secret updates briefly mismatch the keys.
# Requires Workers Scripts Edit. Use hub-off.yml to disable the hub.
on:
  workflow_dispatch:
    inputs:
      hub:
        description: "Which hub gets the key: next.inflite.ai (the staging hub, for George's phone checks, once hub-stage.yml is green), both (inflite.ai and the staging hub, once his checks pass), or inflite.ai alone"
        type: choice
        options:
          - inflite.ai
          - next.inflite.ai
          - both
        default: inflite.ai

permissions:
  contents: read

# (one change to the hub at a time: this, hub-off.yml and hub-stage.yml share it. This one waits its turn; the off switch
# takes over from it. GitHub keeps one waiting run per group: dispatch one at a time, as a second waiting one replaces
# the first)
concurrency:
  group: inflite-hub-key
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  key:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      HUBS: ${{ inputs.hub }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/hub
      - name: Check the token's there
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN isn't set (Settings → Secrets and variables → Actions): a Cloudflare API token with Account › Workers Scripts › Edit. Nothing was changed."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (and leaves it for the steps after as HUB_ACCOUNT: each step is a shell of its own)
      - name: Find the Cloudflare account
        id: account
        run: |
          . .github/hub/hub.sh
          cf_account
      - name: Make a new key, and give it to the site Workers, then the Worker
        id: key
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/.github/hub/hub.sh"
          give_key "$HUBS"
      - name: Wait for the hub to say it's ready
        id: wait
        if: ${{ !cancelled() && steps.key.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 18
        run: |
          . .github/hub/hub.sh
          wait_ready "$HUBS"
      - name: Check Chat's hub copy is still not found to anyone without the key
        id: door
        if: ${{ !cancelled() && steps.key.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          . .github/hub/hub.sh
          door_shut
      - name: What's live now
        if: always()
        env:
          OUT_TOKEN: ${{ steps.token.outcome }}
          OUT_ACCOUNT: ${{ steps.account.outcome }}
          OUT_KEY: ${{ steps.key.outcome }}
          OUT_WAIT: ${{ steps.wait.outcome }}
          OUT_DOOR: ${{ steps.door.outcome }}
        run: |
          if [ ! -f .github/hub/hub.sh ]; then echo "::error::This repo's .github/hub wasn't checked out: nothing was changed."; exit 1; fi
          . .github/hub/hub.sh
          key_verdict
